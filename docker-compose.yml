services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kicktippx
      POSTGRES_USER: kicktippx
      POSTGRES_PASSWORD: kicktippx
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kicktippx"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kicktippx
      SPRING_DATASOURCE_USERNAME: kicktippx
      SPRING_DATASOURCE_PASSWORD: kicktippx
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: change-me-in-production-change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: /api
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
